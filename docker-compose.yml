services:
  postgres:
    image: postgres:16-alpine
    container_name: alfarezel-market-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: alfarezel_market
      POSTGRES_USER: alfarezel
      POSTGRES_PASSWORD: alfarezel_password
    volumes:
      - alfarezel_postgres:/var/lib/postgresql/data

volumes:
  alfarezel_postgres:
